openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SkillSync AI API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: users
    description: User operations
  - name: jobs
    description: Job and internship operations
  - name: assessments
    description: Skill assessment operations
  - name: learning
    description: Learning recommendations
  - name: resume
    description: Resume management
  - name: career
    description: Career tracking
  - name: freelance
    description: Freelancer marketplace
  - name: college
    description: College forms and submissions
  - name: notifications
    description: Notifications
  - name: dashboard
    description: Dashboard aggregates

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # AUTH
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # USERS
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users (admin)
      parameters:
        - name: role
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersListResponse"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}/skills:
    get:
      operationId: getUserSkills
      tags: [users]
      summary: Get user skills
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User skills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSkill"
    post:
      operationId: addUserSkill
      tags: [users]
      summary: Add a skill to user profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddSkillBody"
      responses:
        "201":
          description: Skill added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSkill"

  /users/{id}/skills/{skillId}:
    patch:
      operationId: updateUserSkill
      tags: [users]
      summary: Update a user skill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: skillId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddSkillBody"
      responses:
        "200":
          description: Skill updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSkill"
    delete:
      operationId: deleteUserSkill
      tags: [users]
      summary: Delete a user skill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: skillId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Skill deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /users/{id}/education:
    get:
      operationId: getUserEducation
      tags: [users]
      summary: Get user education records
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Education list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Education"
    post:
      operationId: addUserEducation
      tags: [users]
      summary: Add education record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Education"
      responses:
        "201":
          description: Education added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Education"

  /users/{id}/education/{eduId}:
    patch:
      operationId: updateEducation
      tags: [users]
      summary: Update education record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: eduId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Education"
      responses:
        "200":
          description: Education updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Education"
    delete:
      operationId: deleteEducation
      tags: [users]
      summary: Delete education record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: eduId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Education deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /users/{id}/projects:
    get:
      operationId: getUserProjects
      tags: [users]
      summary: Get user projects
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: addUserProject
      tags: [users]
      summary: Add project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Project"
      responses:
        "201":
          description: Project added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /users/{id}/projects/{projectId}:
    patch:
      operationId: updateProject
      tags: [users]
      summary: Update project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Project"
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [users]
      summary: Delete project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /users/{id}/certifications:
    get:
      operationId: getUserCertifications
      tags: [users]
      summary: Get user certifications
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Certification list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Certification"
    post:
      operationId: addUserCertification
      tags: [users]
      summary: Add certification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Certification"
      responses:
        "201":
          description: Certification added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certification"

  /users/{id}/certifications/{certId}:
    patch:
      operationId: updateCertification
      tags: [users]
      summary: Update certification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: certId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Certification"
      responses:
        "200":
          description: Certification updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certification"
    delete:
      operationId: deleteCertification
      tags: [users]
      summary: Delete certification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: certId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Certification deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /users/{id}/experience:
    get:
      operationId: getUserExperience
      tags: [users]
      summary: Get user experience
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Experience list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Experience"
    post:
      operationId: addUserExperience
      tags: [users]
      summary: Add experience
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Experience"
      responses:
        "201":
          description: Experience added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experience"

  /users/{id}/experience/{expId}:
    patch:
      operationId: updateExperience
      tags: [users]
      summary: Update experience
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: expId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Experience"
      responses:
        "200":
          description: Experience updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experience"
    delete:
      operationId: deleteExperience
      tags: [users]
      summary: Delete experience
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: expId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Experience deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /users/{id}/analytics:
    get:
      operationId: getUserAnalytics
      tags: [users]
      summary: Get user profile analytics
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Profile analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileAnalytics"

  # JOBS
  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List jobs and internships
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [job, internship, freelance, hackathon]
        - name: search
          in: query
          schema:
            type: string
        - name: skills
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Jobs list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobsListResponse"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Create a job posting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobBody"
      responses:
        "201":
          description: Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get job by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/{id}/apply:
    post:
      operationId: applyJob
      tags: [jobs]
      summary: Apply for a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyJobBody"
      responses:
        "201":
          description: Application submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobApplication"

  /jobs/matches:
    get:
      operationId: getJobMatches
      tags: [jobs]
      summary: Get AI-matched jobs for current user
      responses:
        "200":
          description: Matched jobs with scores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobMatch"

  /applications:
    get:
      operationId: listApplications
      tags: [jobs]
      summary: List applications for current user or recruiter
      parameters:
        - name: jobId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Applications list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobApplication"

  /applications/{id}:
    patch:
      operationId: updateApplication
      tags: [jobs]
      summary: Update application status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateApplicationBody"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobApplication"

  # ASSESSMENTS
  /assessments:
    get:
      operationId: listAssessments
      tags: [assessments]
      summary: List available assessments
      parameters:
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Assessments list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assessment"
    post:
      operationId: createAssessment
      tags: [assessments]
      summary: Create an assessment (admin/recruiter)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssessmentBody"
      responses:
        "201":
          description: Assessment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assessment"

  /assessments/{id}:
    get:
      operationId: getAssessment
      tags: [assessments]
      summary: Get assessment with questions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assessment with questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentDetail"

  /assessments/{id}/submit:
    post:
      operationId: submitAssessment
      tags: [assessments]
      summary: Submit assessment answers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAssessmentBody"
      responses:
        "200":
          description: Assessment result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentResult"

  /assessment-results:
    get:
      operationId: listAssessmentResults
      tags: [assessments]
      summary: Get assessment results for current user
      responses:
        "200":
          description: List of assessment results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssessmentResult"

  /learning/recommendations:
    get:
      operationId: getLearningRecommendations
      tags: [learning]
      summary: Get personalized learning recommendations
      responses:
        "200":
          description: Learning recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningRecommendation"

  /learning/roadmap:
    get:
      operationId: getLearningRoadmap
      tags: [learning]
      summary: Get personalized learning roadmap
      responses:
        "200":
          description: Learning roadmap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningRoadmap"

  /learning/progress:
    get:
      operationId: getLearningProgress
      tags: [learning]
      summary: Get learning progress and streaks
      responses:
        "200":
          description: Learning progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningProgress"
    post:
      operationId: updateLearningProgress
      tags: [learning]
      summary: Mark a learning item as complete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLearningProgressBody"
      responses:
        "200":
          description: Updated progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningProgress"

  # RESUME
  /resume:
    get:
      operationId: getResume
      tags: [resume]
      summary: Get current user resume versions
      responses:
        "200":
          description: List of resumes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resume"
  
  /resume/upload:
    post:
      operationId: uploadResumeFile
      tags: [resume]
      summary: Upload a resume file (PDF/DOCX)
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                resume:
                  type: string
                  format: binary
      responses:
        "201":
          description: Resume uploaded and parsed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resume"

  /resume/sync:
    post:
      operationId: syncResumeData
      tags: [resume]
      summary: Sync parsed resume data to profile
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                profile:
                  type: object
                skills:
                  type: array
                  items:
                    type: string
                education:
                  type: array
                  items:
                    type: object
                experience:
                  type: array
                  items:
                    type: object
      responses:
        "200":
          description: Profile synced
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /resume/analyze:
    post:
      operationId: analyzeResume
      tags: [resume]
      summary: AI analysis of resume with ATS score
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeResumeBody"
      responses:
        "200":
          description: Resume analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeAnalysis"

  # CAREER
  /career/stats:
    get:
      operationId: getCareerStats
      tags: [career]
      summary: Get career tracking stats for current user
      responses:
        "200":
          description: Career stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerStats"

  /career/timeline:
    get:
      operationId: getCareerTimeline
      tags: [career]
      summary: Get career activity timeline
      responses:
        "200":
          description: Career timeline
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CareerEvent"

  /career/badges:
    get:
      operationId: getUserBadges
      tags: [career]
      summary: Get earned badges and XP for current user
      responses:
        "200":
          description: Badges and XP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GamificationProfile"

  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [career]
      summary: Get leaderboard rankings
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  # FREELANCE
  /freelance/projects:
    get:
      operationId: listFreelanceProjects
      tags: [freelance]
      summary: List freelance projects
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: skills
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Projects list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreelanceProjectsListResponse"
    post:
      operationId: createFreelanceProject
      tags: [freelance]
      summary: Post a freelance project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFreelanceProjectBody"
      responses:
        "201":
          description: Project created
          content:
