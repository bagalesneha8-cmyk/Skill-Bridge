        token:
          type: string
      required: [user, token]

    # USER
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [student, recruiter, faculty, freelancer_client, admin]
        avatar:
          type: string
        bio:
          type: string
        institution:
          type: string
        location:
          type: string
        phone:
          type: string
        socialLinks:
          $ref: "#/components/schemas/SocialLinks"
        privacy:
          $ref: "#/components/schemas/PrivacySettings"
