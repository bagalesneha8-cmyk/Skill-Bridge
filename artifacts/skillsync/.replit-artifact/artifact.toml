kind = "web"
previewPath = "/"
title = "SkillSync AI"
version = "1.0.0"
id = "artifacts/skillsync"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26038

[services.development]
run = "pnpm --filter @workspace/skillsync run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/skillsync", "run", "build" ]
publicDir = "artifacts/skillsync/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26038"
BASE_PATH = "/"
